name: Build Multi-Platform Releases

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux x86
          - goos: linux
            goarch: amd64
            name: linux-amd64
          - goos: linux
            goarch: "386"
            name: linux-386
          
          # Linux ARM
          - goos: linux
            goarch: arm64
            name: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            name: linux-armv7
          - goos: linux
            goarch: arm
            goarm: "6"
            name: linux-armv6
          - goos: linux
            goarch: arm
            goarm: "5"
            name: linux-armv5
          
          # Linux MIPS (常见于路由器)
          - goos: linux
            goarch: mips
            name: linux-mips
          - goos: linux
            goarch: mipsle
            name: linux-mipsle
          - goos: linux
            goarch: mips64
            name: linux-mips64
          - goos: linux
            goarch: mips64le
            name: linux-mips64le
          
          # Linux 其他架构
          - goos: linux
            goarch: ppc64le
            name: linux-ppc64le
          - goos: linux
            goarch: riscv64
            name: linux-riscv64
          
          # macOS
          - goos: darwin
            goarch: amd64
            name: darwin-amd64
          - goos: darwin
            goarch: arm64
            name: darwin-arm64
          
          # Windows
          - goos: windows
            goarch: amd64
            name: windows-amd64
          - goos: windows
            goarch: "386"
            name: windows-386
          - goos: windows
            goarch: arm64
            name: windows-arm64
          
          # FreeBSD (部分路由器固件)
          - goos: freebsd
            goarch: amd64
            name: freebsd-amd64
          - goos: freebsd
            goarch: arm64
            name: freebsd-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Install dependencies
      run: go mod download

    - name: Install UPX
      run: |
        sudo apt-get update
        sudo apt-get install -y upx-ucl

    - name: Build binary
      env:
        CGO_ENABLED: 0
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
      run: |
        OUTPUT_NAME="login-${{ matrix.name }}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT_NAME="${OUTPUT_NAME}.exe"
        fi
        
        go build -ldflags="-s -w" -o "${OUTPUT_NAME}"
        
        echo "Built: ${OUTPUT_NAME}"
        ls -lh "${OUTPUT_NAME}"

    - name: Create UPX compressed version
      run: |
        OUTPUT_NAME="login-${{ matrix.name }}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT_NAME="${OUTPUT_NAME}.exe"
        fi
        
        UPX_NAME="login-${{ matrix.name }}-upx"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          UPX_NAME="${UPX_NAME}.exe"
        fi
        
        echo "Original size:"
        ls -lh "${OUTPUT_NAME}"
        
        cp "${OUTPUT_NAME}" "${UPX_NAME}"
        
        echo "Compressing with UPX..."
        if upx --best --lzma "${UPX_NAME}"; then
          echo "Compressed size:"
          ls -lh "${UPX_NAME}"
          echo "UPX_SUCCESS=true" >> $GITHUB_ENV
        else
          echo "UPX compression failed for ${{ matrix.name }}, removing compressed file"
          rm -f "${UPX_NAME}"
          echo "UPX_SUCCESS=false" >> $GITHUB_ENV
        fi

    - name: Upload original binary
      uses: actions/upload-artifact@v4
      with:
        name: login-${{ matrix.name }}
        path: login-${{ matrix.name }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        retention-days: 30

    - name: Upload UPX compressed binary
      uses: actions/upload-artifact@v4
      if: env.UPX_SUCCESS == 'true'
      with:
        name: login-${{ matrix.name }}-upx
        path: login-${{ matrix.name }}-upx${{ matrix.goos == 'windows' && '.exe' || '' }}
        retention-days: 30
